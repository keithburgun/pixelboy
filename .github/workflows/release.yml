# Builds and publishes a release whenever the version in package.json changes on main
# (or when run by hand from the Actions tab). It creates the tag (e.g. v0.2.0), the
# Windows installer (PixelBoy-Setup.exe) and the web zip (pixelboy-web.zip).
# Installed copies of PixelBoy see the new release and update themselves.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - name: Build and publish Windows installer
        if: steps.check.outputs.skip != 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web version
        if: steps.check.outputs.skip != 'true'
        run: npm run build:web
      - name: Attach web zip to the release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: gh release upload "v${{ steps.check.outputs.version }}" dist/pixelboy-web.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
